name: test

# Unit tests on every pull request and every push to main. No secrets: these
# are pure unit tests (jsdom), never the backend's DB suite.
#
# Lint runs too but does not block yet: the codebase has 10 pre-existing
# lint errors (EditProfile.jsx and friends, plus `process` in vite.config.js)
# that predate the tests. Once those are cleaned up, remove continue-on-error
# and lint becomes a gate as well.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm test
